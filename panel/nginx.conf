# The panel is served from the same origin as the API, with /v1 proxied through: no CORS
# configuration to get wrong, and the bearer token stays in the browser that typed it.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /v1/ {
    proxy_pass http://api:8080/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
  }

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # A single-page app: every unknown path is the app, not a 404 page.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
