apiVersion: v2
name: liveops-console
description: >-
  A LiveOps control plane for a live game: versioned remote configuration with rollback,
  an append-only audit trail, and scheduled rewards that happen exactly once. The API and
  the worker are one image; the panel is a separate deployment and talks to the API.
