{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default (include "liveops-console.fullname" .) .Values.serviceAccount.name }}
  labels:
    {{- include "liveops-console.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The process talks to PostgreSQL over the network and to nothing in the API server, so it
# has no reason to hold a token.
automountServiceAccountToken: false
{{- end }}
