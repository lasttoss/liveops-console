{{- if not .Values.auth.existingSecret }}
{{- if or .Values.auth.tokens .Values.database.dsn }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "liveops-console.fullname" . }}
  labels:
    {{- include "liveops-console.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.auth.tokens }}
  LIVEOPS_TOKENS: {{ . | quote }}
  {{- end }}
  LIVEOPS_DSN: {{ include "liveops-console.dsn" . | quote }}
{{- end }}
{{- end }}
